<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Lane — Ryan & Sheila</title>
<meta name="description" content="A walk through memory lane — Ryan & Sheila.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap">
<style>

html,body{margin:0;padding:0;background:#2a0408;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
a{color:#e8c97e}a:hover{color:#f5dfa6}
button{font:inherit}
@keyframes ml-swing{0%{transform:rotate(0)}25%{transform:rotate(24deg)}75%{transform:rotate(-24deg)}100%{transform:rotate(0)}}
@keyframes ml-breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ml-pulse{0%{box-shadow:0 0 0 0 rgba(176,138,62,.45)}70%{box-shadow:0 0 0 14px rgba(176,138,62,0)}100%{box-shadow:0 0 0 0 rgba(176,138,62,0)}}
@keyframes ml-twinkle{0%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1.1) rotate(45deg);opacity:1}100%{transform:scale(0) rotate(90deg);opacity:0}}
@keyframes ml-fallA{0%{transform:translate(0,-40px) rotate(0);opacity:0}8%{opacity:1}50%{transform:translate(34px,48vh) rotate(220deg)}90%{opacity:1}100%{transform:translate(-14px,104vh) rotate(460deg);opacity:0}}
@keyframes ml-fallB{0%{transform:translate(0,-40px) rotate(0);opacity:0}8%{opacity:1}50%{transform:translate(-30px,50vh) rotate(-200deg)}90%{opacity:1}100%{transform:translate(18px,104vh) rotate(-420deg);opacity:0}}
@keyframes ml-rise{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--sx,6px),-190px) scale(1);opacity:0}}
@keyframes ml-nudge{0%,100%{transform:translateY(0) rotate(45deg);opacity:.6}50%{transform:translateY(6px) rotate(45deg);opacity:1}}
@keyframes ml-flash{0%{transform:scale(0) rotate(0);opacity:0}30%{transform:scale(1.2) rotate(30deg);opacity:1}100%{transform:scale(.2) rotate(80deg);opacity:0}}

</style>
</head>
<body>
<div id="app-root"></div>

<div style="position:relative;width:min(100vw,390px);height:min(100dvh,844px);overflow:hidden;touch-action:none;background:radial-gradient(120% 75% at 50% 42%,#6a0d16 0%,#530a12 55%,#3c060c 100%);box-shadow:0 0 60px rgba(20,0,3,.35)">

<div onPointerDown="{{ pgDown }}" onPointerMove="{{ pgMove }}" onPointerUp="{{ pgUp }}" onPointerCancel="{{ pgUp }}" onWheel="{{ pgWheel }}" style="position:absolute;inset:0;opacity:{{ screenOp }};transform:translateY({{ pageY }});transition:{{ pageTr }}">

<sc-if value="{{ isS0 }}" hint-placeholder-val="{{ true }}">
<section data-screen-label="01 Home — The Church" onClick="{{ tapChurch }}" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;user-select:none;overflow:hidden"><div style="position:absolute;inset:0;background:url(assets/altar.jpg) center/cover"></div><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,4,8,.55) 0%,rgba(42,4,8,.12) 34%,rgba(42,4,8,.55) 70%,rgba(42,4,8,.96) 100%)"></div><div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 24px 40px"><div style="font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#e6cfc0">Ryan &amp; Sheila</div><h1 style="margin:2px 0 0;font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(40px,7vh,56px);line-height:1.02;color:#e8c97e;text-wrap:balance">Walk through memory lane</h1><div style="font-style:italic;font-size:19px;color:#e6cfc0;opacity:{{ homeHintOp }};transition:opacity .4s;animation:ml-breathe 2.4s ease-in-out infinite">Tap to begin</div></div></section>
</sc-if>

          <div style="position:absolute;left:99px;top:38px;width:22px;height:12px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,#9aa1a8,#f4f6f7,#8d949b)"></div>
          <div style="position:absolute;left:94px;top:20px;width:32px;height:24px;background:linear-gradient(160deg,#ffffff,#dbeaf3 40%,#9fbccc 70%,#ffffff);clip-path:polygon(22% 0,78% 0,100% 38%,50% 100%,0 38%)"></div>
          <div style="position:absolute;left:94px;top:20px;width:32px;height:9px;background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(170,200,215,.6),rgba(255,255,255,.95));clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)"></div>
        </div>
      </div>
      <sc-if value="{{ sparkle }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:0;top:0;width:220px;height:230px;z-index:6;pointer-events:none">
          <div style="position:absolute;left:88px;top:8px;width:44px;height:44px;background:#fffaf0;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:ml-twinkle 1.8s ease-out 0s infinite"></div>

  <div style="min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;text-align:center">

<sc-if value="{{ isS2 }}" hint-placeholder-val="{{ false }}">

  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
    <div style="font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#e6cfc0">Chapter II</div>
    <h2 style="margin:0;font-weight:500;font-size:32px;letter-spacing:.02em;color:#fbf1e4">The Vows</h2>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:0">
    <div onClick="{{ tapScroll }}" style="position:relative;width:300px;max-width:100%;height:{{ stageH }}px;transition:height .5s ease;cursor:{{ scrollCursor }}">

        <div style="position:absolute;left:78px;top:14px;width:36px;height:18px;border-radius:50%;border:2.5px solid #efe3c6;transform:rotate(-22deg)"></div>
        <div style="position:absolute;left:130px;top:12px;width:36px;height:18px;border-radius:50%;border:2.5px solid #efe3c6;transform:rotate(18deg)"></div>

        this.setState({ shots: 1, printing: true });
        this.later(() => this.setState({ printed: true, s3Next: true }), 5200);
      },
      boothCursor: s.shots ? 'default' : 'pointer',
      boothHint: !s.shots ? 'Tap to print the day' : 'Printing…',
      printedShow: s.printed,
      flashOp: s.flash ? 0.95 : 0, flashTr: s.flash ? '.04s' : '.5s',
      stripY: s.printing ? '0%' : '-102%', stripTr: s.printing ? 'transform 4.6s cubic-bezier(.45,.05,.55,.95)' : 'none',
      devOp: s.printing ? 0 : 1,
      frS: Math.max(0.5, Math.min(1, (vh - 300) / 400, (vw - 70) / 280)),
      frW: 280 * Math.max(0.5, Math.min(1, (vh - 300) / 400, (vw - 70) / 280)), frH: 400 * Math.max(0.5, Math.min(1, (vh - 300) / 400, (vw - 70) / 280)),

      leftX: -84 + p * 30, leftR: -8 + p * 18, rightX: 84 - p * 30, rightR: 8 - p * 18,
      glassTransition: s.dragging ? 'none' : 'transform .5s cubic-bezier(.3,1.5,.5,1)',
      flashAnim: s.toasted ? 'ml-flash .8s ease-out .05s 1 both' : 'none',
      s4HintShow: !s.toasted,
      toastDown: (e) => {
        this.ac();
        if (s.toasted) return;
        e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
        this.tx = e.clientX; this.setState({ dragging: true });
      },
      toastMove: (e) => {
        if (this.tx == null || s.toasted) return;
        this.setState({ toastP: Math.min(1, Math.abs(e.clientX - this.tx) / 130) });
      },
      toastUp: () => {
        if (this.tx == null) return;
        this.tx = null;
        if (this.state.toastP > 0.55) {
          this.setState({ dragging: false, toastP: 1, toasted: true });
          this.later(() => this.clink(), 160);
          this.later(() => this.setState({ cheers: true }), 700);
          this.later(() => this.setState({ closing: true }), 3600);
        } else this.setState({ dragging: false, toastP: 0 });
      },
      cheersOp: vis(s.cheers), cheersY: s.cheers ? 0 : 14, cheersS: s.cheers ? 1 : .9,
      closingOp: vis(s.closing), closingPE: pe(s.closing),
      bubbles
    };
  }
}

var q = new URLSearchParams(location.search);
var props = { startScreen: q.get('screen') || '0', sound: true, songUrl: '' };
mountApp(Component, document.getElementById('app-tpl'), document.getElementById('app-root'), props);
</script>
